<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="50%" stop-color="#121826"/>
      <stop offset="100%" stop-color="#07090e"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="50%" stop-color="#00C2FF"/>
      <stop offset="100%" stop-color="#7928CA"/>
    </linearGradient>
    <linearGradient id="waveGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background circle with subtle glowing border -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="4"/>
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#cyanGrad)" stroke-width="8" opacity="0.8"/>
  
  <!-- SoundWave Curved Dynamic Waves (Spotify-inspired sound curved waves + equalizer) -->
  <g filter="url(#neonGlow)">
    <!-- Top outer wave -->
    <path d="M 120 180 C 180 130 332 130 392 180" 
          fill="none" 
          stroke="url(#waveGlow)" 
          stroke-width="32" 
          stroke-linecap="round"/>
    
    <!-- Middle wave -->
    <path d="M 148 245 C 196 205 316 205 364 245" 
          fill="none" 
          stroke="url(#waveGlow)" 
          stroke-width="30" 
          stroke-linecap="round"/>
    
    <!-- Bottom inner wave -->
    <path d="M 178 310 C 210 280 302 280 334 310" 
          fill="none" 
          stroke="url(#waveGlow)" 
          stroke-width="28" 
          stroke-linecap="round"/>
  </g>

  <!-- Subtle pulse dot center-bottom -->
  <circle cx="256" cy="375" r="10" fill="#00F0FF" filter="url(#neonGlow)"/>
</svg>
